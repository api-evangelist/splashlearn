name: SplashLearn
description: 'SplashLearn (operated by StudyPad, Inc.) is a game-based learning platform
  offering math and English/ELA curriculum for preschool through Grade 5 students,
  used by parents, teachers, schools, and homeschoolers. It delivers interactive games,
  worksheets, lesson plans, and progress tracking across web and mobile (iOS/Android)
  apps, plus homeschool, summer-learning, and SpringBoard programs. Surfaced as an
  Accel portfolio company and added to the API Evangelist network. No public developer
  API, SDK, or developer portal is currently published; this profile captures the
  company identity and public web/security surface.'
